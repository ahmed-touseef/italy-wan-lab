frr defaults traditional
hostname naples
service integrated-vtysh-config
!
! Router naples, generated by gen.py.
! bandwidth 100000 = 100 Mbit/s, like FastEthernet, so every OSPF cost is 1
! exactly as in Packet Tracer.
!
interface eth1
 description site 1 (Fa0/0 in Packet Tracer)
 ip address 10.6.1.1/24
 bandwidth 100000
!
interface eth2
 description site 2 (Fa1/0 in Packet Tracer)
 ip address 10.6.2.1/24
 bandwidth 100000
!
interface eth3
 description site 3 (Fa7/0 in Packet Tracer)
 ip address 10.6.3.1/24
 bandwidth 100000
!
interface eth4
 description site 4 (Fa6/0 in Packet Tracer)
 ip address 10.6.4.1/24
 bandwidth 100000
!
interface eth5
 description ring to rome (Fa4/0 in Packet Tracer)
 ip address 10.0.56.2/30
 bandwidth 100000
!
interface eth6
 description ring to milan (Fa5/0 in Packet Tracer)
 ip address 10.0.16.2/30
 bandwidth 100000
!
router ospf
 ospf router-id 6.6.6.6
 network 10.6.0.0/16 area 0
 network 10.0.0.0/16 area 0
!
line vty
!
