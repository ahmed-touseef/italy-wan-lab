frr defaults traditional
hostname florence
service integrated-vtysh-config
!
! Router florence, generated by gen.py.
! bandwidth 100000 = 100 Mbit/s, like FastEthernet, so every OSPF cost is 1
! exactly as in Packet Tracer.
! Site ports are OSPF passive: their networks are advertised, but no OSPF
! hellos go to or are accepted from the office LANs.
!
interface eth1
 description site 1 (Fa0/0 in Packet Tracer)
 ip address 10.4.1.1/24
 bandwidth 100000
 ip ospf passive
!
interface eth2
 description site 2 (Fa1/0 in Packet Tracer)
 ip address 10.4.2.1/24
 bandwidth 100000
 ip ospf passive
!
interface eth3
 description site 3 (Fa7/0 in Packet Tracer)
 ip address 10.4.3.1/24
 bandwidth 100000
 ip ospf passive
!
interface eth4
 description site 4 (Fa6/0 in Packet Tracer)
 ip address 10.4.4.1/24
 bandwidth 100000
 ip ospf passive
!
interface eth5
 description ring to genoa (Fa4/0 in Packet Tracer)
 ip address 10.0.34.2/30
 bandwidth 100000
!
interface eth6
 description ring to rome (Fa5/0 in Packet Tracer)
 ip address 10.0.45.1/30
 bandwidth 100000
!
router ospf
 ospf router-id 4.4.4.4
 network 10.4.0.0/16 area 0
 network 10.0.0.0/16 area 0
!
line vty
!
