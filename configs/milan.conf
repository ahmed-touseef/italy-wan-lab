frr defaults traditional
hostname milan
service integrated-vtysh-config
!
! Router milan, generated by gen.py.
! bandwidth 100000 = 100 Mbit/s, like FastEthernet, so every OSPF cost is 1
! exactly as in Packet Tracer.
! Site ports are OSPF passive: their networks are advertised, but no OSPF
! hellos go to or are accepted from the office LANs.
!
interface eth1
 description site 1 (Fa0/0 in Packet Tracer)
 ip address 10.1.1.1/24
 bandwidth 100000
 ip ospf passive
!
interface eth2
 description site 2 (Fa1/0 in Packet Tracer)
 ip address 10.1.2.1/24
 bandwidth 100000
 ip ospf passive
!
interface eth3
 description site 3 (Fa7/0 in Packet Tracer)
 ip address 10.1.3.1/24
 bandwidth 100000
 ip ospf passive
!
interface eth4
 description site 4 (Fa6/0 in Packet Tracer)
 ip address 10.1.4.1/24
 bandwidth 100000
 ip ospf passive
!
interface eth5
 description ring to turin (Fa4/0 in Packet Tracer)
 ip address 10.0.12.1/30
 bandwidth 100000
!
interface eth6
 description ring to naples (Fa5/0 in Packet Tracer)
 ip address 10.0.16.1/30
 bandwidth 100000
!
interface wg0
 description WireGuard remote access (created by remote-access.sh)
 ip address 10.9.0.1/24
 ip ospf passive
!
router ospf
 ospf router-id 1.1.1.1
 network 10.1.0.0/16 area 0
 network 10.0.0.0/16 area 0
 network 10.9.0.0/24 area 0
!
line vty
!
