# Security settings for wan.touseefahmed.com, included by its server block.
# Installed to /etc/nginx/snippets/italy-wan-security.conf by harden-web.sh.

server_tokens off;                                   # "nginx", without the version

# Read only site: anything other than GET and HEAD is refused
if ($request_method !~ ^(GET|HEAD)$) { return 405; }

# Per visitor limits (zones in /etc/nginx/conf.d/italy-wan-limits.conf).
# The page asks for status.json every 10 s, so 5 requests a second is plenty.
limit_req zone=italywan burst=20 nodelay;
limit_req_status 429;
limit_conn italywan_conn 20;
limit_conn_status 429;

# Hidden files (.git, .env and similar) are never served; Let's Encrypt still works
location ~ /\.(?!well-known/) { deny all; }

# Browser protections
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
