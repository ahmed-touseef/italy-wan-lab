# wan.touseefahmed.com: live status page of the Italy WAN lab.
# Static files only. status.json is rewritten every 15 s by italy-wan-status.service.
server {
    listen 80;
    server_name wan.touseefahmed.com;

    root /var/www/italy-wan;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = /status.json {
        expires -1;
    }
    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }
}
